
name: Pruebas automatizadas de Staging

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    name: Validar proyecto
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar integridad de los CSV
        run: python scripts/profile_sources.py --check

      - name: Comprobar facturas antes del DW
        run: python scripts/check_dw_readiness.py

      - name: Ejecutar pruebas automatizadas
        run: python -m unittest discover -s tests -v
